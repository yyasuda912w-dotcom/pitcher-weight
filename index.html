<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>投手ウエイト管理</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  background: #f5f5f7; color: #1d1d1f; font-size: 15px;
  user-select: none; -webkit-user-select: none;
}
.container { max-width: 480px; margin: 0 auto; padding: 16px 14px 100px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #e5e5ea; }
.header h1 { font-size: 17px; font-weight: 600; margin: 0; }
.header .date { font-size: 13px; color: #86868b; }
.section { margin-bottom: 18px; }
.section-label { font-size: 12px; color: #86868b; margin-bottom: 8px; font-weight: 500; }
.btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.btn { background: #fff; border: 1px solid #e5e5ea; border-radius: 10px; padding: 14px 8px; text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.1s; color: #1d1d1f; }
.btn:active { transform: scale(0.96); }
.btn.selected { background: #007aff; color: #fff; border-color: #007aff; }
.menu-card { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.menu-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.menu-name { font-size: 14px; font-weight: 600; }
.menu-toggle { font-size: 12px; color: #007aff; background: none; border: none; cursor: pointer; padding: 4px 8px; }
.menu-toggle.active { color: #34c759; font-weight: 600; }
.input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
.input-cell { display: flex; flex-direction: column; align-items: center; }
.input-cell-label { font-size: 10px; color: #86868b; margin-bottom: 4px; }
.spinner { display: flex; align-items: center; background: #f5f5f7; border-radius: 8px; width: 100%; height: 36px; overflow: hidden; }
.spinner-btn { width: 28px; height: 36px; background: none; border: none; font-size: 18px; font-weight: 600; color: #007aff; cursor: pointer; flex-shrink: 0; }
.spinner-btn:active { background: #e5e5ea; }
.spinner-value { flex: 1; text-align: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.spinner-input { flex: 1; text-align: center; font-size: 14px; font-weight: 600; background: #fff; border: 2px solid #007aff; border-radius: 4px; width: 100%; height: 28px; -webkit-user-select: text; user-select: text; padding: 0; }
.menu-card.disabled .input-row { display: none; }
.menu-card.disabled .menu-name { color: #c7c7cc; }
.other-input { width: 100%; border: 1px solid #e5e5ea; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; background: #fff; -webkit-user-select: text; user-select: text; margin-top: 6px; }
.other-input:focus { outline: 2px solid #007aff; }
.not-done-toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: #86868b; cursor: pointer; }
.not-done-toggle input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #ff3b30; }
.menu-card.not-done .input-row { opacity: 0.35; pointer-events: none; }
.menu-card.not-done .menu-name::after { content: " (未実施)"; font-size: 11px; color: #ff3b30; font-weight: 400; }
.rpe-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.rpe-btn { background: #fff; border: 1px solid #e5e5ea; border-radius: 6px; padding: 10px 0; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; }
.rpe-btn:active { transform: scale(0.92); }
.rpe-btn.selected { background: #ff9500; color: #fff; border-color: #ff9500; }
.rpe-labels { display: flex; justify-content: space-between; font-size: 10px; color: #86868b; margin-top: 4px; }
textarea { width: 100%; min-height: 60px; border: 1px solid #e5e5ea; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; background: #fff; resize: none; -webkit-user-select: text; user-select: text; }
textarea:focus { outline: 2px solid #007aff; }
.submit-btn { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: calc(100% - 28px); max-width: 452px; background: #007aff; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
.submit-btn:active { transform: translateX(-50%) scale(0.98); }
.submit-btn:disabled { background: #c7c7cc; box-shadow: none; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }
.toast.success { background: rgba(52,199,89,0.95); }
.toast.error { background: rgba(255,59,48,0.95); }
.no-menu-msg { text-align: center; color: #86868b; padding: 20px; font-size: 13px; }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
.set-label { font-size: 12px; color: #86868b; font-weight: 600; text-align: center; }
.set-input-wrap { display: flex; flex-direction: column; align-items: center; }
.set-input-label { font-size: 10px; color: #86868b; margin-bottom: 2px; }
.set-spinner { display: flex; align-items: center; background: #f5f5f7; border-radius: 8px; width: 100%; height: 34px; overflow: hidden; }
.set-spinner-btn { width: 26px; height: 34px; background: none; border: none; font-size: 16px; font-weight: 600; color: #007aff; cursor: pointer; flex-shrink: 0; }
.set-spinner-btn:active { background: #e5e5ea; }
.set-spinner-val { flex: 1; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; }
.set-del-btn { width: 28px; height: 28px; background: none; border: none; color: #ff3b30; font-size: 18px; cursor: pointer; line-height: 1; padding: 0; }
.add-set-btn { margin-top: 8px; width: 100%; background: #f0f7ff; border: 1px dashed #007aff; border-radius: 8px; padding: 7px; font-size: 13px; color: #007aff; font-weight: 600; cursor: pointer; }
.add-set-btn:active { background: #e0f0ff; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>投手ウエイト管理</h1>
    <span class="date" id="today"></span>
  </div>
  <div class="section">
    <div class="section-label">名前</div>
    <div class="btn-grid" id="nameGrid"></div>
  </div>
  <div class="section">
    <div class="section-label">本日の種目</div>
    <div class="btn-grid cols-3" id="categoryGrid"></div>
    <div id="otherCategoryWrap" style="display:none; margin-top:8px;">
      <input type="text" class="other-input" id="otherCategoryInput" placeholder="種目を自由に入力してください">
    </div>
  </div>
  <div class="section">
    <div class="section-label">メニュー（行ったものをタップして記録）</div>
    <div id="lastRecord" style="background:#f5f5f7;border-radius:10px;padding:10px 12px;margin-bottom:10px;min-height:36px;font-size:13px;">
      <span style="color:#c7c7cc">名前と種目を選択すると前回記録が表示されます</span>
    </div>
    <div id="menuList"></div>
  </div>
  <div class="section">
    <div class="section-label">RPE（主観的運動強度）</div>
    <div class="rpe-grid" id="rpeGrid"></div>
    <div class="rpe-labels"><span>弱い</span><span>強い</span></div>
  </div>
  <div class="section">
    <div class="section-label">備考（任意）</div>
    <textarea id="memo" placeholder="例）明日登板、肘を伸ばした際に少し違和感あり"></textarea>
  </div>
  <button class="submit-btn" id="submitBtn">送信する</button>
</div>
<div class="toast" id="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxHu898lfrAW1SRffdTUEvm6U6_jybFGTShOK7AC_MWaiiBGcmgQcdrb80W1qPNBMcWSQ/exec";

const PITCHERS = [
  "植松 麟之介", "藤本 逸希",
  "磯部 祐吉", "伊藤 幹太", "加藤 達哉", "蟹江 哲舟",
  "佐竹 泰河", "寺下 颯真", "中井 創友", "中山 敦",
  "前田 龍太朗", "横丸 冬馬",
  "沖 悠人", "近藤 秀太", "堺 千真", "長野 晴太", "三浦 大輝",
  "秋山 創大", "織田 優太", "木村 颯汰", "小山 隼和",
  "佐藤 爽楽", "島田 大翔", "田川 竜之介", "坪 眞都",
  "中島 稜太", "服部 圭真", "松下 紘也"
];

const CATEGORIES = {
  "SQ": [
    { name: "パーフェクトプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "クロスプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "ルーマニアンデッドリフト", default: { weight: 60, reps: 8, sets: 3 } },
    { name: "ベントオーバーローイング", default: { weight: 50, reps: 10, sets: 3 } },
    { name: "ゴブレットスクワット", default: { weight: 30, reps: 10, sets: 3 } },
    { name: "バックスクワット", default: { weight: 80, reps: 5, sets: 3 } },
    { name: "アイソメトリックスクワット", default: { weight: 0, reps: 10, sets: 3 }, unit: "秒" },
    { name: "スクワットジャンプ", default: { weight: 0, reps: 5, sets: 3 } }
  ],
  "DL": [
    { name: "パーフェクトプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "クロスプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "ルーマニアンデッドリフト", default: { weight: 60, reps: 8, sets: 3 } },
    { name: "ベントオーバーローイング", default: { weight: 50, reps: 10, sets: 3 } },
    { name: "ブルガリアンスクワット", default: { weight: 20, reps: 10, sets: 3 } },
    { name: "デッドリフト", default: { weight: 80, reps: 5, sets: 3 } },
    { name: "アイソメトリックデッドリフト", default: { weight: 0, reps: 10, sets: 3 }, unit: "秒" },
    { name: "デッドリフトジャンプ", default: { weight: 40, reps: 5, sets: 3 } }
  ],
  "CL": [
    { name: "パーフェクトプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "クロスプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "パワークリーン or ハイプル", default: { weight: 50, reps: 5, sets: 3 } },
    { name: "CMJ", default: { weight: 0, reps: 5, sets: 3 } },
    { name: "ワンハンドダンベルプレス", default: { weight: 15, reps: 8, sets: 3 } },
    { name: "ランドマイン（回旋 or プッシュ）", default: { weight: 20, reps: 10, sets: 3 } }
  ],
  "Heavy": [
    { name: "パーフェクトプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "クロスプランク", default: { weight: 0, reps: 20, sets: 3 }, unit: "秒" },
    { name: "ルーマニアンデッドリフト", default: { weight: 60, reps: 8, sets: 3 } },
    { name: "ベントオーバーローイング", default: { weight: 50, reps: 10, sets: 3 } },
    { name: "アイソメトリックスクワット", default: { weight: 0, reps: 30, sets: 3 }, unit: "秒" },
    { name: "アイソメトリックデッドリフト", default: { weight: 0, reps: 30, sets: 3 }, unit: "秒" },
    { name: "パワークリーン or ハイプル", default: { weight: 50, reps: 5, sets: 3 } },
    { name: "ランドマイン（回旋 or プッシュ）", default: { weight: 20, reps: 10, sets: 3 } }
  ],
  "なし": [],
  "その他": []
};

const state = {
  name: null, category: null, otherCategory: "",
  menus: {},       // { name: { active, notDone, sets: [{weight, reps}] } }
  customMenus: [], // [{name, notDone, sets:[{weight,reps}]}]
  extraMenus: {},  // {cat: [{name, notDone, sets:[{weight,reps}]}]}
  rpe: null, memo: "", lastRecord: null
};

function init() {
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  document.getElementById("today").textContent = `${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;

  const nameGrid = document.getElementById("nameGrid");
  PITCHERS.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "btn"; btn.textContent = name;
    btn.onclick = () => selectName(name, btn);
    nameGrid.appendChild(btn);
  });

  const catGrid = document.getElementById("categoryGrid");
  Object.keys(CATEGORIES).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "btn"; btn.textContent = cat;
    btn.onclick = () => selectCategory(cat, btn);
    catGrid.appendChild(btn);
  });

  document.getElementById("otherCategoryInput").addEventListener("input", e => {
    state.otherCategory = e.target.value;
  });

  const rpeGrid = document.getElementById("rpeGrid");
  for (let i = 0; i <= 10; i++) {
    const btn = document.createElement("button");
    btn.className = "rpe-btn"; btn.textContent = i;
    btn.onclick = () => selectRpe(i, btn);
    rpeGrid.appendChild(btn);
  }

  document.getElementById("memo").addEventListener("input", e => { state.memo = e.target.value; });
  document.getElementById("submitBtn").onclick = submit;
  renderMenus();
}

function selectName(name, btn) {
  state.name = name;
  document.querySelectorAll("#nameGrid .btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  fetchLastRecord();
}

function selectCategory(cat, btn) {
  state.category = cat;
  state.menus = {}; state.customMenus = []; state.otherCategory = "";
  if (!state.extraMenus[cat]) state.extraMenus[cat] = [];
  document.querySelectorAll("#categoryGrid .btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  if (cat === "その他") {
    document.getElementById("otherCategoryWrap").style.display = "block";
    document.getElementById("otherCategoryInput").value = "";
    document.getElementById("otherCategoryInput").focus();
  } else {
    document.getElementById("otherCategoryWrap").style.display = "none";
  }
  fetchLastRecord();
  renderMenus();
}

function selectRpe(value, btn) {
  state.rpe = value;
  document.querySelectorAll("#rpeGrid .rpe-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

async function fetchLastRecord() {
  if (!state.name || !state.category) return;
  const lastDiv = document.getElementById("lastRecord");
  if (lastDiv) lastDiv.textContent = "前回記録を取得中...";
  try {
    const url = GAS_URL + "?action=getLast&name=" + encodeURIComponent(state.name) + "&category=" + encodeURIComponent(state.category);
    const res = await fetch(url, { mode: "cors" });
    const data = await res.json();
    state.lastRecord = data.record || null;
  } catch (e) {
    state.lastRecord = null;
  }
  renderLastRecord();
}

function renderLastRecord() {
  const lastDiv = document.getElementById("lastRecord");
  if (!lastDiv) return;
  if (!state.lastRecord) {
    lastDiv.innerHTML = '<span style="color:#c7c7cc">前回記録なし</span>';
    return;
  }
  const r = state.lastRecord;
  const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" }) : "";
  lastDiv.innerHTML = `
    <div style="font-size:12px;color:#86868b;margin-bottom:4px">📋 前回（${date}）</div>
    <div style="font-size:13px;white-space:pre-wrap;color:#1c1c1e">${r.menuText || "記録なし"}</div>
    ${r.rpe != null ? `<div style="font-size:12px;color:#86868b;margin-top:4px">RPE: ${r.rpe}　備考: ${r.memo || "なし"}</div>` : ""}
  `;
}

function getList(mode) {
  return mode === "custom" ? state.customMenus : state.extraMenus[state.category];
}

function renderMenus() {
  const container = document.getElementById("menuList");
  container.innerHTML = "";

  if (!state.category) {
    container.innerHTML = '<div class="no-menu-msg">↑ 種目を選択してください</div>';
    return;
  }
  if (state.category === "なし") {
    container.innerHTML = '<div class="no-menu-msg">休養日です</div>';
    return;
  }
  if (state.category === "その他") {
    renderCustomMenuSection(container, state.customMenus, "custom");
    return;
  }

  CATEGORIES[state.category].forEach(menu => {
    if (!state.menus[menu.name]) {
      state.menus[menu.name] = { active: false, notDone: false, sets: [{ weight: menu.default.weight, reps: menu.default.reps }] };
    }
    const m = state.menus[menu.name];
    const unit = menu.unit || "回";
    const card = document.createElement("div");
    card.className = "menu-card" + (!m.active ? " disabled" : "") + (m.active && m.notDone ? " not-done" : "");
    card.appendChild(makeMenuHeader(menu.name, m.active));
    if (m.active) {
      m.sets.forEach((s, si) => {
        card.appendChild(makeSetRow(menu.name, si, s, unit, m.sets.length > 1));
      });
      const addSetBtn = document.createElement("button");
      addSetBtn.className = "add-set-btn";
      addSetBtn.textContent = `＋ セットを追加`;
      addSetBtn.onclick = () => { m.sets.push({ weight: m.sets[m.sets.length-1].weight, reps: m.sets[m.sets.length-1].reps }); renderMenus(); };
      card.appendChild(addSetBtn);
      const notDoneLabel = document.createElement("label");
      notDoneLabel.className = "not-done-toggle";
      notDoneLabel.innerHTML = `<input type="checkbox" data-name="${menu.name}" ${m.notDone ? "checked" : ""}><span>実施しなかった</span>`;
      notDoneLabel.querySelector("input").onchange = (e) => toggleNotDone(menu.name, e.target.checked);
      card.appendChild(notDoneLabel);
    }
    container.appendChild(card);
  });

  container.querySelectorAll(".menu-toggle").forEach(btn => {
    btn.onclick = () => toggleMenu(btn.dataset.name);
  });

  if (!state.extraMenus[state.category]) state.extraMenus[state.category] = [];
  renderCustomMenuSection(container, state.extraMenus[state.category], "extra");
}

function renderCustomMenuSection(container, list, mode) {
  list.forEach((m, idx) => {
    if (!m.sets) m.sets = [{ weight: m.weight || 0, reps: m.reps || 10 }];
    const card = document.createElement("div");
    card.className = "menu-card" + (m.notDone ? " not-done" : "");
    // ヘッダー
    const header = document.createElement("div");
    header.className = "menu-card-header";
    header.innerHTML = `<span class="menu-name">${m.name}</span>
      <button class="del-btn" data-idx="${idx}" data-mode="${mode}" style="font-size:12px;color:#ff3b30;background:none;border:none;cursor:pointer;padding:4px 8px;">削除</button>`;
    header.querySelector(".del-btn").onclick = () => { getList(mode).splice(idx, 1); renderMenus(); };
    card.appendChild(header);
    // セット行
    m.sets.forEach((s, si) => {
      const row = makeCustomSetRow(mode, idx, si, s, m.sets.length > 1);
      card.appendChild(row);
    });
    // セット追加ボタン
    const addSetBtn = document.createElement("button");
    addSetBtn.className = "add-set-btn";
    addSetBtn.textContent = "＋ セットを追加";
    addSetBtn.onclick = () => { m.sets.push({ weight: m.sets[m.sets.length-1].weight, reps: m.sets[m.sets.length-1].reps }); renderMenus(); };
    card.appendChild(addSetBtn);
    // 未実施チェック
    const notDoneLabel = document.createElement("label");
    notDoneLabel.className = "not-done-toggle";
    notDoneLabel.innerHTML = `<input type="checkbox" class="cnotdone" data-idx="${idx}" data-mode="${mode}" ${m.notDone ? "checked" : ""}><span>実施しなかった</span>`;
    notDoneLabel.querySelector("input").onchange = (e) => { getList(mode)[idx].notDone = e.target.checked; renderMenus(); };
    card.appendChild(notDoneLabel);
    container.appendChild(card);
  });

  const uid = mode + list.length;
  const addArea = document.createElement("div");
  addArea.style.cssText = "display:flex;gap:8px;margin-top:6px;";
  addArea.innerHTML = `
    <input type="text" id="addInput_${uid}" class="other-input" style="flex:1;margin-top:0" placeholder="種目を追加（例：ダンベルカール）">
    <button id="addBtn_${uid}" style="background:#007aff;color:#fff;border:none;border-radius:10px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;">追加</button>
  `;
  container.appendChild(addArea);
  const addBtn = document.getElementById(`addBtn_${uid}`);
  const addInput = document.getElementById(`addInput_${uid}`);
  const doAdd = () => {
    const name = addInput.value.trim();
    if (!name) return;
    getList(mode).push({ name, notDone: false, sets: [{ weight: 0, reps: 10 }] });
    renderMenus();
  };
  addBtn.onclick = doAdd;
  addInput.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
}

function makeCustomSetRow(mode, idx, si, s, canDelete) {
  const row = document.createElement("div");
  row.className = "set-row";
  row.innerHTML = `
    <span class="set-label">${si+1}</span>
    <div class="set-input-wrap">
      <span class="set-input-label">重量(kg)</span>
      <div class="set-spinner">
        <button class="set-spinner-btn">−</button>
        <span class="set-spinner-val">${s.weight}</span>
        <button class="set-spinner-btn">+</button>
      </div>
    </div>
    <div class="set-input-wrap">
      <span class="set-input-label">回数</span>
      <div class="set-spinner">
        <button class="set-spinner-btn">−</button>
        <span class="set-spinner-val">${s.reps}</span>
        <button class="set-spinner-btn">+</button>
      </div>
    </div>
    <button class="set-del-btn" style="visibility:${canDelete ? 'visible' : 'hidden'}">×</button>
  `;
  const btns = row.querySelectorAll(".set-spinner-btn");
  const vals = row.querySelectorAll(".set-spinner-val");
  btns[0].onclick = () => { s.weight = Math.max(0, Math.round((s.weight-2.5)*10)/10); renderMenus(); };
  btns[1].onclick = () => { s.weight = Math.round((s.weight+2.5)*10)/10; renderMenus(); };
  vals[0].onclick = () => startSetInput(vals[0], s, "w", null);
  btns[2].onclick = () => { s.reps = Math.max(0, s.reps-1); renderMenus(); };
  btns[3].onclick = () => { s.reps += 1; renderMenus(); };
  vals[1].onclick = () => startSetInput(vals[1], s, "r", null);
  row.querySelector(".set-del-btn").onclick = () => { getList(mode)[idx].sets.splice(si, 1); renderMenus(); };
  return row;
}

function makeMenuHeader(name, active) {
  const div = document.createElement("div");
  div.className = "menu-card-header";
  div.innerHTML = `
    <span class="menu-name">${name}</span>
    <button class="menu-toggle ${active ? "active" : ""}" data-name="${name}">
      ${active ? "✓ 記録中" : "+ 記録する"}
    </button>`;
  div.querySelector(".menu-toggle").onclick = () => toggleMenu(name);
  return div;
}

function makeSetRow(menuName, si, s, unit, canDelete) {
  const isSecs = unit === "秒";
  const row = document.createElement("div");
  row.className = "set-row";
  row.innerHTML = `
    <span class="set-label">${si+1}</span>
    <div class="set-input-wrap">
      <span class="set-input-label">重量(kg)</span>
      <div class="set-spinner">
        <button class="set-spinner-btn">−</button>
        <span class="set-spinner-val">${s.weight}</span>
        <button class="set-spinner-btn">+</button>
      </div>
    </div>
    <div class="set-input-wrap">
      <span class="set-input-label">${unit}数</span>
      <div class="set-spinner">
        <button class="set-spinner-btn">−</button>
        <span class="set-spinner-val">${s.reps}</span>
        <button class="set-spinner-btn">+</button>
      </div>
    </div>
    <button class="set-del-btn" style="visibility:${canDelete ? 'visible' : 'hidden'}">×</button>
  `;
  const btns = row.querySelectorAll(".set-spinner-btn");
  const vals = row.querySelectorAll(".set-spinner-val");

  // 重量
  btns[0].onclick = () => { s.weight = Math.max(0, Math.round((s.weight - 2.5)*10)/10); activateMenu(menuName); renderMenus(); };
  btns[1].onclick = () => { s.weight = Math.round((s.weight + 2.5)*10)/10; activateMenu(menuName); renderMenus(); };
  vals[0].onclick = () => startSetInput(vals[0], s, "w", menuName);

  // 回数/秒数
  btns[2].onclick = () => { s.reps = Math.max(0, s.reps - (isSecs ? 5 : 1)); activateMenu(menuName); renderMenus(); };
  btns[3].onclick = () => { s.reps += isSecs ? 5 : 1; activateMenu(menuName); renderMenus(); };
  vals[1].onclick = () => startSetInput(vals[1], s, "r", menuName);

  // 削除
  row.querySelector(".set-del-btn").onclick = () => {
    const m = state.menus[menuName];
    if (m) m.sets.splice(si, 1);
    renderMenus();
  };
  return row;
}

function activateMenu(name) {
  if (state.menus[name]) { state.menus[name].active = true; state.menus[name].notDone = false; }
}

function startSetInput(span, s, type, menuName) {
  const currentVal = type === "w" ? s.weight : s.reps;
  const input = document.createElement("input");
  input.type = "number"; input.className = "spinner-input";
  input.value = currentVal; input.min = 0;
  span.replaceWith(input);
  input.focus(); input.select();
  const commit = () => {
    let val = parseFloat(input.value);
    if (isNaN(val) || val < 0) val = 0;
    if (type === "w") s.weight = Math.round(val * 10) / 10;
    else s.reps = Math.round(val);
    if (menuName) activateMenu(menuName);
    renderMenus();
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") renderMenus(); });
}

function toggleMenu(name) {
  const m = state.menus[name];
  m.active = !m.active;
  if (!m.active) m.notDone = false;
  renderMenus();
}

function toggleNotDone(name, checked) {
  state.menus[name].notDone = checked;
  renderMenus();
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + (type || "");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function buildMenuText() {
  if (!state.category || state.category === "なし") return "";
  if (state.category === "その他") {
    return state.customMenus.map(m => {
      if (m.notDone) return `${m.name}：実施しなかった`;
      const setLines = (m.sets || []).map((s, i) => s.weight > 0 ? `  ${i+1}セット目: ${s.weight}kg × ${s.reps}回` : `  ${i+1}セット目: ${s.reps}回`);
      return `${m.name}\n${setLines.join("\n")}`;
    }).join("\n");
  }
  const lines = [];
  Object.keys(state.menus).forEach(name => {
    const m = state.menus[name];
    if (!m.active) return;
    if (m.notDone) { lines.push(`${name}：実施しなかった`); return; }
    const menuDef = CATEGORIES[state.category].find(x => x.name === name);
    const unit = menuDef && menuDef.unit ? menuDef.unit : "回";
    const setLines = (m.sets || []).map((s, i) => s.weight > 0 ? `  ${i+1}セット目: ${s.weight}kg × ${s.reps}${unit}` : `  ${i+1}セット目: ${s.reps}${unit}`);
    lines.push(`${name}\n${setLines.join("\n")}`);
  });
  (state.extraMenus[state.category] || []).forEach(em => {
    if (em.notDone) { lines.push(`${em.name}：実施しなかった`); return; }
    const setLines = (em.sets || []).map((s, i) => s.weight > 0 ? `  ${i+1}セット目: ${s.weight}kg × ${s.reps}回` : `  ${i+1}セット目: ${s.reps}回`);
    lines.push(`${em.name}\n${setLines.join("\n")}`);
  });
  return lines.join("\n");
}

async function submit() {
  if (!state.name) return showToast("名前を選択してください", "error");
  if (!state.category) return showToast("種目を選択してください", "error");
  if (state.category === "その他" && !state.otherCategory.trim()) return showToast("種目名を入力してください", "error");
  if (state.rpe === null) return showToast("RPEを選択してください", "error");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送信中...";

  const payload = {
    timestamp: new Date().toISOString(),
    name: state.name,
    category: state.category === "その他" ? `その他：${state.otherCategory}` : state.category,
    menuText: buildMenuText(),
    rpe: state.rpe,
    memo: state.memo || ""
  };

  try {
    await new Promise((resolve, reject) => {
      const timer = setTimeout(resolve, 5000);
      fetch(GAS_URL, {
        method: "POST", body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain" }, mode: "no-cors"
      }).then(() => { clearTimeout(timer); resolve(); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
    showToast("送信しました ✓", "success");
    setTimeout(resetForm, 1500);
  } catch (e) {
    showToast("送信エラー: " + e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "送信する";
  }
}

function resetForm() {
  state.name = null; state.category = null; state.otherCategory = "";
  state.menus = {}; state.customMenus = []; state.extraMenus = {};
  state.lastRecord = null; state.rpe = null; state.memo = "";
  document.getElementById("memo").value = "";
  document.getElementById("otherCategoryInput").value = "";
  document.getElementById("otherCategoryWrap").style.display = "none";
  document.querySelectorAll(".btn.selected, .rpe-btn.selected").forEach(b => b.classList.remove("selected"));
  renderLastRecord();
  renderMenus();
  window.scrollTo(0, 0);
}

init();
</script>
</body>
</html>
